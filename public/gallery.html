<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="/js/guard.js"></script><!-- no "view source" / "inspect" menu or shortcuts on computers and Android (not iPhone/iPad) -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — {{site_name}}</title>
<meta name="description" content="Photos from {{site_name}} events in Harare, Zimbabwe.">
<link rel="icon" href="/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css">
</head>
<body class="subpage">
<header data-site class="is-scrolled"></header>

<main class="wrap">
  <section class="page-head section-title" style="padding-top:140px;">
    <a class="back-link" href="/">{{back_home}}</a>
    <div class="display">{{gallery_title1}}</div>
    <div class="display filled">{{gallery_title2}}</div>
    <div class="tabs" role="group" aria-label="Filter photos">
      <button type="button" data-cat="" aria-pressed="true">{{gallery_tab_all}}</button>
      <button type="button" data-cat="experience" aria-pressed="false">{{gallery_tab_experience}}</button>
      <button type="button" data-cat="event" aria-pressed="false">{{gallery_tab_event}}</button>
      <button type="button" data-cat="gallery" aria-pressed="false">{{gallery_tab_highlights}}</button>
    </div>
  </section>

  <div class="gallery-days" id="grid" aria-live="polite"></div>
  <p class="status-msg" id="status">Loading photos…</p>
  <div class="load-more"><button class="btn btn-outline" id="more" hidden>Load more photos</button></div>
</main>

<footer data-site></footer>

<script src="/js/common.js"></script>
<script>
(function () {
  'use strict';
  var R = window.RNB;
  var grid = document.getElementById('grid');
  var status = document.getElementById('status');
  var more = document.getElementById('more');
  var buttons = document.querySelectorAll('[data-cat]');
  var PAGE = 60, items = [], category = '', request = 0;
  var el = R.el, TZ = 'Africa/Harare';
  var lastMonth = '', days = {};

  // Photos are grouped like a phone's gallery: a heading per month, then
  // one block per day (the event's date), newest first.
  function zw(iso, opts) { return new Intl.DateTimeFormat('en-GB', Object.assign({ timeZone: TZ }, opts)).format(new Date(iso)); }
  function dayKey(iso) { return new Intl.DateTimeFormat('en-CA', { timeZone: TZ }).format(new Date(iso)); }
  function monthLabel(key) {
    var now = dayKey(new Date().toISOString()).slice(0, 7);
    var d = new Date(now + '-15T12:00:00Z'); d.setUTCMonth(d.getUTCMonth() - 1);
    var prev = d.toISOString().slice(0, 7);
    if (key === now) return R.t('gallery_this_month') || 'This month';
    if (key === prev) return R.t('gallery_last_month') || 'Last month';
    return zw(key + '-15T12:00:00Z', { month: 'long', year: 'numeric' });
  }
  function dayLabel(iso) {
    var sameYear = dayKey(iso).slice(0, 4) === dayKey(new Date().toISOString()).slice(0, 4);
    return zw(iso, sameYear ? { weekday: 'long', day: 'numeric', month: 'long' } : { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }
  function addPhoto(i) {
    var p = items[i];
    var key = dayKey(p.taken_at);
    var month = key.slice(0, 7);
    if (month !== lastMonth) {
      grid.appendChild(el('h2', { class: 'gallery-month', text: monthLabel(month) }));
      lastMonth = month;
    }
    var day = days[key];
    if (!day) {
      day = days[key] = { count: 0, titles: [], title: el('span', { class: 'day-events' }), num: el('span', { class: 'day-count' }), grid: el('div', { class: 'gallery-grid' }) };
      grid.appendChild(el('section', { class: 'gallery-day' }, [
        el('div', { class: 'gallery-day-head' }, [el('h3', null, [el('span', { text: dayLabel(p.taken_at) }), day.title]), day.num]),
        day.grid
      ]));
    }
    if (p.event_title && day.titles.indexOf(p.event_title) < 0) {
      day.titles.push(p.event_title);
      day.title.textContent = day.titles.join(' · ');
    }
    day.count += 1;
    day.num.textContent = day.count + (day.count === 1 ? ' photo' : ' photos');
    day.grid.appendChild(R.galleryItem(items, i));
  }

  function load(reset) {
    var mine = ++request;
    if (reset) { items = []; grid.textContent = ''; lastMonth = ''; days = {}; status.hidden = false; status.textContent = 'Loading photos…'; }
    more.hidden = true;
    var url = '/api/photos?limit=' + PAGE + '&offset=' + items.length + (category ? '&category=' + category : '');
    R.api(url).then(function (data) {
      if (mine !== request) return; // a newer filter was picked meanwhile
      var start = items.length;
      items = items.concat(data.photos);
      for (var i = start; i < items.length; i++) addPhoto(i);
      status.hidden = items.length > 0;
      status.textContent = R.t('gallery_empty');
      more.hidden = !data.more;
    }).catch(function () {
      status.hidden = false;
      status.textContent = 'Could not load photos. Please refresh the page.';
    });
  }

  function select(cat) {
    category = ['experience', 'event', 'gallery'].indexOf(cat) >= 0 ? cat : '';
    buttons.forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.cat === category ? 'true' : 'false'); });
    var url = new URL(location.href);
    if (category) url.searchParams.set('category', category); else url.searchParams.delete('category');
    history.replaceState(null, '', url);
    load(true);
  }

  buttons.forEach(function (b) { b.addEventListener('click', function () { select(b.dataset.cat); }); });
  more.addEventListener('click', function () { load(false); });
  select(new URLSearchParams(location.search).get('category') || '');
})();
</script>
</body>
</html>
