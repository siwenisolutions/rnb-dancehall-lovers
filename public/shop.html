<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="/js/guard.js"></script><!-- no "view source" / "inspect" menu or shortcuts on computers and Android (not iPhone/iPad) -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{shop_title}}</title>
<meta name="description" content="Official {{site_name}} merchandise: caps, tees, jackets, cups and more. Pay with EcoCash or InnBucks. Delivery in Zimbabwe within 14 days.">
<link rel="icon" href="/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css">
</head>
<body class="subpage">
<header data-site class="is-scrolled"></header>

<main class="wrap shop-page">
  <section class="shop-hero">
    <div class="shop-hero-img" id="shopBanner" aria-hidden="true"></div>
    <nav class="crumbs" aria-label="Breadcrumb"><a href="/">Home</a><span aria-hidden="true">/</span><b>Merch</b></nav>
    <div class="shop-hero-main">
      <div class="shop-hero-copy">
        <p class="shop-kicker">Official merch · {{site_name}}</p>
        <h1 class="display"><span class="outline">{{shop_title1}}</span> {{shop_title2}}</h1>
        <p class="shop-hero-intro">{{shop_intro}}</p>
        <div class="shop-cats" id="shopCats" role="group" aria-label="Category"></div>
      </div>
      <aside class="shop-hero-side">
        <a class="shop-feature" id="shopFeature" href="/shop" hidden></a>
        <button class="shop-bagpill" id="bagPill" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l-1 12H7z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
          <span id="bagPillText">Your bag · 0</span>
        </button>
      </aside>
    </div>
    <div class="shop-perks">
      <span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h11v10H3z"/><path d="M14 9h4l3 3.5V16h-7z"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>{{shop_delivery}}</span>
      <span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>EcoCash · InnBucks</span>
      <a href="/returns#merch"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg>7-day returns</a>
    </div>
  </section>

  <section class="shop-main">
    <aside class="shop-filters" id="shopFilters" aria-label="Filters"></aside>
    <div class="shop-results">
      <div class="shop-toolbar">
        <button class="shop-filter-btn" id="filterToggle" type="button" aria-expanded="false" aria-controls="shopFilters">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>Filters
        </button>
        <span class="shop-count" id="shopCount" aria-live="polite"></span>
        <label class="shop-sort">Sort by
          <select id="shopSort">
            <option value="featured">Featured</option>
            <option value="new">Newest</option>
            <option value="low">Price: low to high</option>
            <option value="high">Price: high to low</option>
          </select>
        </label>
      </div>
      <div class="shop-grid" id="shopGrid" aria-live="polite"><p class="status-msg">Loading the shop…</p></div>
    </div>
  </section>
</main>

<!-- Bag button (shows once something is in the bag) -->
<button class="bag-fab" id="bagFab" type="button" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l-1 12H7z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
  <span id="bagFabText">Bag</span>
</button>

<!-- One item / bag / checkout / order status, in a sheet -->
<div class="shop-sheet" id="sheet" hidden>
  <div class="shop-sheet-bg" data-close></div>
  <div class="shop-sheet-box" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <button class="shop-x" type="button" data-close aria-label="Close">×</button>
    <div id="sheetBody"></div>
  </div>
</div>

<footer data-site></footer>

<script src="/js/common.js"></script>
<script src="/js/shop.js"></script>
</body>
</html>
